plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '7.1.2' // Apply the Shadow plugin for shading
}

group = 'co.killionrevival'
version = '1.0-SNAPSHOT'
description = 'KillionRevival Combat Logging Plugin'

def targetJavaVersion = 21

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
    maven {
        name = 'citizens-repo'
        url = 'https://maven.citizensnpcs.co/repo'
    }
    maven {
        url = 'https://maven.enginehub.org/repo/'
    }
    maven {
        url = 'https://maven.pkg.github.com/KillionRevival/KillionCommons'
        credentials {
            username = project.findProperty('gpr.user') ?: System.getenv('USERNAME') ?: System.getenv('GITHUB_USERNAME')
            password = project.findProperty('gpr.key') ?: System.getenv('TOKEN') ?: System.getenv('GITHUB_TOKEN')
        }
    }
}

dependencies {
    // PaperMC API dependency
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'

    // Lombok for code generation
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // WorldGuard API
    implementation 'com.sk89q.worldguard:worldguard-bukkit:7.0.12'

    // KillionCommons library
    implementation 'co.killionrevival:killioncommons:2.0.0-SNAPSHOT'

    // SQLite JDBC driver
    implementation 'org.xerial:sqlite-jdbc:3.46.0.0'

    // Citizens API with exclusions
    compileOnly('net.citizensnpcs:citizens-main:2.0.35-SNAPSHOT') {
        exclude group: '*', module: '*'
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion

    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    // Configuration to match Maven Shade Plugin behavior
    minimize() // Optional: Minimize the JAR file size
    // Additional configurations can be added here
}
